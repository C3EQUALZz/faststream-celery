name: Release

# Publishes the package to PyPI when a version tag is pushed. The version is
# derived from the tag by hatch-vcs; PyPI access uses trusted publishing
# (OIDC), so no API token secret is stored in the repository — the project
# must be registered as a trusted publisher on PyPI first.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs derives the version from tags
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          # No cache: published artifacts must not come from a poisonable cache.
          enable-cache: false
          python-version: "3.14"
      - name: Build distributions
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
