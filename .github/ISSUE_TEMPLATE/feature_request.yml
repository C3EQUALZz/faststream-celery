name: Feature request
description: Propose a capability or a change in behaviour
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and what does that cost you?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: >-
        What should happen instead? Keep in mind that the public API stays
        within FastStream broker idioms (ADR-0002) — Celery-specific API
        extensions are out of scope.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area does this belong to?
      description: See docs/design.md. Pick "Not sure" rather than guessing.
      options:
        - Broker / routing
        - Publishing
        - Consuming / scheduling
        - Testing utilities
        - Cross-cutting (config, tooling, docs)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
