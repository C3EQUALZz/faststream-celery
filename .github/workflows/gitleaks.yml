name: Secret scan

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (filesystem scan)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo
          --config /repo/.gitleaks.toml
          --redact --exit-code 1
