# zizmor configuration: https://docs.zizmor.sh/configuration/
rules:
  dangerous-triggers:
    ignore:
      # pull_request_target is intentional here: actions/labeler v5 only
      # applies labels via the GitHub API and never checks out PR code.
      - labeler.yaml
  unpinned-uses:
    config:
      policies:
        # Actions are pinned by (major) version tags, not commit hashes.
        "*": ref-pin
