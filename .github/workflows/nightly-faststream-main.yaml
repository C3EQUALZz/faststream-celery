name: Nightly faststream@main

# Runs the test suite against faststream installed from git `main` instead of
# the locked release, so breakage in `faststream._internal` (used by the
# adapter layer, see docs/design.md §12) is caught before upstream releases.

on:
  schedule:
    - cron: "23 4 * * *" # daily at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-against-faststream-main:
    name: Unit tests against faststream@main (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Replace faststream with git main
        run: uv pip install --python .venv/bin/python "faststream @ git+https://github.com/ag2ai/faststream.git@main"

      # --no-sync: keep the faststream@main install, don't revert to uv.lock.
      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} --no-sync pytest tests/unit
