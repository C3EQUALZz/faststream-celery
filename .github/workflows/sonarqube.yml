name: SonarQube

on:
  push:
    branches: [master]
  pull_request:

# Organization and project key live in sonar-project.properties.
#
# The token lives in the `SONAR_TOKEN` environment, which is why this job
# declares one. Nothing gates the job itself: a job-level `if` is evaluated
# before the environment is resolved, so an environment variable read there is
# always empty. The upload is guarded at step level instead, where secrets
# *are* readable: a fork or dependabot pull request has no access to the
# token and should skip the upload rather than fail on an empty one.
permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    environment: SONAR_TOKEN
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar attributes issues to the introducing commit
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.14"
      - run: uv sync --frozen
      - name: Generate coverage (xml)
        run: >-
          uv run pytest tests/unit --cov --cov-report=xml
          --junit-xml=junit.xml
      - name: SonarQube scan
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
