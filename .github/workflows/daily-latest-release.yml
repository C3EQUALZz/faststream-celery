name: Latest released dependencies

on:
  schedule:
    - cron: "23 4 * * *" # daily at 04:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    name: Latest releases (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install nox
        run: uv sync --frozen --group test --no-install-project --python ${{ matrix.python-version }}

      - name: Test latest released dependencies
        run: >-
          uv run --no-sync nox --python ${{ matrix.python-version }}
          -s tests -k 'faststream_latest and kombu_latest'
