name: PR tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (ruff, codespell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group lint --no-install-project

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff check
        run: uv run ruff check

      - name: Codespell
        run: uv run codespell -L Dependant,dependant

  mypy:
    name: Mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Mypy
        run: uv run mypy

  static-analysis:
    name: Static analysis (bandit, semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group lint --no-install-project

      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src

      - name: Semgrep
        run: uv run semgrep scan --config auto --error --skip-unknown-extensions src

  tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # `--python` overrides the `.python-version` pin so the matrix version is used.
      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      # pytest-asyncio is configured via pyproject/ini; --suppress-no-test-exit-code
      # keeps the suite green while tests/ is still being filled in.
      - name: Run unit tests
        run: uv run pytest tests/unit --cov --cov-report=xml --suppress-no-test-exit-code

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  integration:
    name: Integration tests (testcontainers)
    # ubuntu-latest runners ship Docker, which testcontainers needs to spin up
    # RabbitMQ/Redis containers for the live Celery wire-compatibility tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # hatch-vcs derives the version from tags

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python "3.13"

      - name: Run integration tests
        run: uv run pytest tests/integration --suppress-no-test-exit-code
