# Configuration file example:  https://docs.astral.sh/ruff/configuration/
# All settings:                https://docs.astral.sh/ruff/settings/

fix = true
preview = true

line-length = 90
indent-width = 4

target-version = "py310"

include = [
    "src/faststream_celery/**/*.py",
    "tests/**/*.py",
    "pyproject.toml",
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[lint]
select = [
    "ALL",
]

ignore = [
    "ANN401",

    # Assign error message to variable
    "EM101",
    "EM102",

    # # preview
    "CPY",
    "PLR6301",

    "D100",     # missing docstring in public module
    "D101",
    "D102",
    "D103",
    "D104",     # missing docstring in public package
    "D105",     # missing docstring in magic methods
    "D106",     # missing docstring in public nested class
    "D107",     # missing docstring in __init__
    "DOC201",
    "DOC202",
    "DOC402",
    "DOC501",
    "DOC502",
]

[lint.per-file-ignores]
# The adapter module exists precisely to import the private `faststream._internal`
# API in one place (docs/design.md §12), so PLC2701 is expected there.
"src/faststream_celery/_internal.py" = [
    "PLC2701",
    "SLF001",
]
"tests/**/*.py" = [
    "S",
    # Tests stub kombu/faststream internals to drive the pipeline directly.
    "SLF001",
    # Stubs must match the signature of the method they replace.
    "FBT001",
    "FBT002",
    # `arg = Context("...")` is the FastStream dependency-injection idiom.
    "B008",
    "PLC1901",
    "PLC2701",
    "PLR0904",
    "PLR0914",
    "PLR2004",
    "ARG001",
    "RUF029",
    "RUF045",
]

[lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true

[lint.pydocstyle]
convention = "google"
ignore-decorators = ["typing.overload"]

[lint.flake8-pytest-style]
fixture-parentheses = true
mark-parentheses = true
parametrize-names-type = "tuple"
parametrize-values-type = "tuple"
parametrize-values-row-type = "tuple"