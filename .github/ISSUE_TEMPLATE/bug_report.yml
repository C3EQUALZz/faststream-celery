name: Bug report
description: Something behaves differently from what it should
labels: ["bug", "needs-triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Broker / router (CeleryBroker, CeleryRouter)
        - Publisher (producing messages)
        - Subscriber / consumer thread
        - ETA scheduler / canvas
        - Message parser (protocol v1/v2)
        - TestCeleryBroker (in-memory testing)
        - Configuration / startup
        - Not sure
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: >-
        A minimal, self-contained code snippet that reproduces the problem. If
        the bug involves interop with a real Celery client/worker, say so and
        include the Celery-side code too.
      render: python
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      description: Redact credentials (broker URLs contain passwords) before pasting.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version
      description: faststream-celery version or commit SHA, plus the faststream version.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, OS, kombu/celery versions, and the broker (RabbitMQ, Redis, ...).
