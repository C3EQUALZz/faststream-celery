[pytest]
xfail_strict = true
testpaths = tests
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
addopts =
    -m 'not slow and not connected'
    --strict-markers
markers =
    slow: slow tests
    connected: tests requiring a real broker over the network
    rabbit: RabbitMQ broker tests
    redis: Redis broker tests
    all: the full test suite
