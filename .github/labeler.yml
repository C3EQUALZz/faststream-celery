# Auto-label PRs by changed paths (actions/labeler v6).

"area: broker":
  - changed-files:
      - any-glob-to-any-file:
          - "src/faststream_celery/broker/**"
          - "src/faststream_celery/configs/**"

"area: publisher":
  - changed-files:
      - any-glob-to-any-file:
          - "src/faststream_celery/publisher/**"
          - "src/faststream_celery/response.py"

"area: subscriber":
  - changed-files:
      - any-glob-to-any-file:
          - "src/faststream_celery/subscriber/**"
          - "src/faststream_celery/parser.py"
          - "src/faststream_celery/message.py"

"area: testing":
  - changed-files:
      - any-glob-to-any-file: "src/faststream_celery/testing.py"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - "tests/**"
          - ".coveragerc"

"area: ci":
  - changed-files:
      - any-glob-to-any-file: ".github/**"

"area: tooling":
  - changed-files:
      - any-glob-to-any-file:
          - "justfile"
          - "ruff.toml"
          - "mypy.ini"
          - ".pre-commit-config.yaml"
          - "pyproject.toml"
          - "uv.lock"
          - "noxfile.py"

"area: agents":
  - changed-files:
      - any-glob-to-any-file:
          - "AGENTS.md"
          - "CLAUDE.md"
          - "GEMINI.md"
          - "CONTEXT.md"
          - ".agents/**"
          - ".claude/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "docs/**"
          - "**/*.md"
