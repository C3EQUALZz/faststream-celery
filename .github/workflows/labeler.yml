name: Labeler

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Label PR by path
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: pull_request_target must never run pull-request code.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
